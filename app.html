<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة مستشاري التوجيه - المدية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#193047;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:980px;margin:35px auto;padding:18px}.hero{background:#12456a;color:white;border-radius:16px;padding:25px;text-align:center}.hero h1{font-size:25px}.card{background:white;border:1px solid #dbe4eb;border-radius:14px;padding:22px;margin-top:20px;box-shadow:0 5px 20px #14334a0b}input,select,textarea,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #c4d0d9;width:100%;margin:7px 0 12px}button{background:#17618a;color:white;cursor:pointer;border:0}button.secondary{background:#e6eff5;color:#12456a}button:disabled{opacity:.5}label{font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.notice{padding:12px;background:#eaf4fc;border-radius:8px;white-space:pre-wrap}.error{background:#ffe8e8}.item{border-bottom:1px solid #ddd;padding:12px 0}small{color:#576a77}@media(max-width:650px){.grid{grid-template-columns:1fr}.shell{margin:0}}
</style>
</head>
<body><main class="shell"><header class="hero"><h1>منصة مستشاري التوجيه والإرشاد المدرسي والمهني</h1><p>ولاية المدية — فضاء المستشار والإدارة</p></header>
<section id="auth" class="card"><h2>تسجيل الدخول</h2><label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="email"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password"><button id="loginBtn">دخول</button><hr><h2>إنشاء حساب مستشار</h2><div class="grid"><div><label>الاسم</label><input id="first" maxlength="100"></div><div><label>اللقب</label><input id="last" maxlength="100"></div><div><label>مؤسسة العمل</label><input id="workplace" maxlength="200"></div><div><label>رقم الهاتف</label><input id="phone" type="tel" maxlength="30"></div><div><label>البريد الإلكتروني</label><input id="email" type="email"></div><div><label>كلمة المرور (12 حرفًا على الأقل)</label><input id="password" type="password" autocomplete="new-password"></div></div><button id="signupBtn">إرسال طلب التسجيل</button></section>
<section id="dashboard" class="card hidden"><button id="logoutBtn" class="secondary">تسجيل الخروج</button><h2 id="welcome">مرحبًا</h2><div id="accountStatus" class="notice"></div><div id="counselorPanel" class="hidden"><h3>إضافة تقرير مهني</h3><label>المجال</label><select id="domain"><option value="information">الإعلام</option><option value="guidance">التوجيه</option><option value="support">المرافقة</option><option value="evaluation">التقويم</option></select><label>عنوان التقرير</label><input id="reportTitle"><label>تاريخ النشاط</label><input id="activityDate" type="date"><label>وصف التقرير</label><textarea id="reportDescription"></textarea><button id="reportBtn">إرسال التقرير</button><h3>إرسال انشغال مهني</h3><label>نوع الانشغال</label><select id="category"><option value="administrative">إداري</option><option value="pedagogical">تربوي</option><option value="organizational">تنظيمي</option><option value="material">وسائل وتجهيزات</option><option value="other">أخرى</option></select><label>العنوان</label><input id="concernTitle"><label>التفاصيل</label><textarea id="concernDescription"></textarea><button id="concernBtn">إرسال الانشغال</button><h3>تقاريري</h3><div id="myReports"></div><h3>انشغالاتي</h3><div id="myConcerns"></div></div><div id="adminPanel" class="hidden"><h3>طلبات التسجيل</h3><div id="pendingList"></div><h3>التقارير</h3><div id="allReports"></div><h3>الانشغالات والردود</h3><div id="allConcerns"></div></div></section><p id="message" class="notice" role="status" aria-live="polite">جاهز.</p></main>
<script>
const SUPABASE_URL='https://xsewchrpggsjcmndvtdu.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_PzEQBIRRELbpxOggdln1pQ_EV4rCEno';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const el=id=>document.getElementById(id),val=id=>el(id).value.trim();
const msg=(text,error=false)=>{el('message').textContent=text;el('message').className='notice'+(error?' error':'')};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=(id,on)=>el(id).classList.toggle('hidden',!on);
async function signUp(){try{if(!val('first')||!val('last')||!val('workplace')||!val('email')||!val('password'))throw Error('أكمل البيانات المطلوبة');if(val('password').length<12)throw Error('اختر كلمة مرور من 12 حرفًا على الأقل');el('signupBtn').disabled=true;const {data,error}=await db.auth.signUp({email:val('email'),password:val('password'),options:{data:{first_name:val('first'),last_name:val('last'),workplace:val('workplace'),phone:val('phone')}}});if(error)throw error;msg('تم إرسال طلب التسجيل. إذا كان تأكيد البريد الإلكتروني مفعلًا، افتح رسالة التأكيد أولًا. ثم انتظر موافقة المدير.');if(data.session)await load();}catch(e){msg(e.message,true)}finally{el('signupBtn').disabled=false}}
async function login(){try{el('loginBtn').disabled=true;const {error}=await db.auth.signInWithPassword({email:val('loginEmail'),password:el('loginPassword').value});if(error)throw error;await load()}catch(e){msg(e.message,true)}finally{el('loginBtn').disabled=false}}
async function logout(){await db.auth.signOut();show('auth',true);show('dashboard',false);msg('تم تسجيل الخروج')}
async function load(){const {data:{user}}=await db.auth.getUser();if(!user){show('auth',true);show('dashboard',false);return}show('auth',false);show('dashboard',true);el('welcome').textContent='مرحبًا '+user.email;const {data:role,error}=await db.from('user_roles').select('role,approval_status').eq('user_id',user.id).single();if(error){msg('تعذر تحميل حالة الحساب: '+error.message,true);return}const approved=role.approval_status==='approved';el('accountStatus').textContent='الدور: '+role.role+' | حالة الموافقة: '+role.approval_status;show('counselorPanel',approved&&role.role==='counselor');show('adminPanel',approved&&role.role==='super_admin');if(approved&&role.role==='counselor')await loadCounselor();if(approved&&role.role==='super_admin')await loadAdmin();if(!approved)msg('حسابك ينتظر موافقة المدير. لا يمكنك إرسال تقارير أو انشغالات بعد.');}
function renderItems(id,rows,render){el(id).innerHTML=rows?.length?rows.map(render).join(''):'<p><small>لا توجد بيانات حاليًا</small></p>'}
async function loadCounselor(){const [r,c]=await Promise.all([db.from('counselor_reports').select('title,domain,status,activity_date').order('created_at',{ascending:false}).limit(30),db.from('counselor_concerns').select('title,status,admin_reply').order('created_at',{ascending:false}).limit(30)]);if(r.error||c.error){msg(r.error?.message||c.error?.message,true);return}renderItems('myReports',r.data,x=>`<div class="item"><b>${escapeHtml(x.title)}</b><p>${escapeHtml(x.domain)} — ${escapeHtml(x.status)} — ${escapeHtml(x.activity_date)}</p></div>`);renderItems('myConcerns',c.data,x=>`<div class="item"><b>${escapeHtml(x.title)}</b><p>${escapeHtml(x.status)}</p><small>${escapeHtml(x.admin_reply||'لم يصل رد بعد')}</small></div>`)}
async function submitReport(){try{const {data:{user}}=await db.auth.getUser();if(!val('reportTitle')||!val('activityDate'))throw Error('عنوان التقرير والتاريخ مطلوبان');const {error}=await db.from('counselor_reports').insert({counselor_id:user.id,domain:val('domain'),title:val('reportTitle'),description:val('reportDescription'),activity_date:val('activityDate')});if(error)throw error;msg('تم إرسال التقرير');await loadCounselor()}catch(e){msg(e.message,true)}}
async function submitConcern(){try{const {data:{user}}=await db.auth.getUser();if(!val('concernTitle')||!val('concernDescription'))throw Error('أدخل العنوان والتفاصيل');const {error}=await db.from('counselor_concerns').insert({counselor_id:user.id,category:val('category'),title:val('concernTitle'),description:val('concernDescription')});if(error)throw error;msg('تم إرسال الانشغال');await loadCounselor()}catch(e){msg(e.message,true)}}
async function loadAdmin(){const [roles,profiles,reports,concerns]=await Promise.all([db.from('user_roles').select('user_id,role,approval_status').eq('role','counselor').eq('approval_status','pending'),db.from('counselor_profiles').select('user_id,first_name,last_name,workplace'),db.from('counselor_reports').select('title,domain,status,created_at').order('created_at',{ascending:false}).limit(50),db.from('counselor_concerns').select('id,title,description,status,admin_reply').order('created_at',{ascending:false}).limit(50)]);const err=[roles,profiles,reports,concerns].find(x=>x.error);if(err){msg(err.error.message,true);return}const names=new Map(profiles.data.map(x=>[x.user_id,x]));renderItems('pendingList',roles.data,x=>{const p=names.get(x.user_id)||{};return `<div class="item"><b>${escapeHtml((p.first_name||'')+' '+(p.last_name||''))}</b><p>${escapeHtml(p.workplace||'')}</p><button data-review="approved" data-id="${escapeHtml(x.user_id)}">موافقة</button><button class="secondary" data-review="rejected" data-id="${escapeHtml(x.user_id)}">رفض</button></div>`});renderItems('allReports',reports.data,x=>`<div class="item"><b>${escapeHtml(x.title)}</b><p>${escapeHtml(x.domain)} — ${escapeHtml(x.status)}</p></div>`);renderItems('allConcerns',concerns.data,x=>`<div class="item"><b>${escapeHtml(x.title)}</b><p>${escapeHtml(x.description)}</p><small>${escapeHtml(x.status)}</small><textarea id="reply-${escapeHtml(x.id)}" placeholder="اكتب رد الإدارة"></textarea><button data-reply="${escapeHtml(x.id)}">إرسال الرد وإغلاق الانشغال</button></div>`)}
el('adminPanel').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{b.disabled=true;if(b.dataset.review){if(!confirm('تأكيد تغيير حالة هذا الحساب؟'))return;const {error}=await db.rpc('review_counselor',{target_user_id:b.dataset.id,new_status:b.dataset.review});if(error)throw error;msg('تم تحديث حالة الحساب')}else if(b.dataset.reply){const reply=val('reply-'+b.dataset.reply);if(!reply)throw Error('اكتب الرد أولًا');const {error}=await db.rpc('reply_to_concern',{target_concern_id:b.dataset.reply,reply_text:reply,new_status:'closed'});if(error)throw error;msg('تم إرسال الرد')}await loadAdmin()}catch(err){msg(err.message,true)}finally{b.disabled=false}});
el('signupBtn').addEventListener('click',signUp);el('loginBtn').addEventListener('click',login);el('logoutBtn').addEventListener('click',logout);el('reportBtn').addEventListener('click',submitReport);el('concernBtn').addEventListener('click',submitConcern);load();
</script></body></html>
