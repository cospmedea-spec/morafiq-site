<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoraFiq 5.0</title><link rel="stylesheet" href="style.css"></head><body data-role="admin"><header><h1>منصة مرافق — مسؤول الموقع</h1><p id="identity">التحقق من الحساب...</p></header><main><section id="auth" class="card"><h2>تسجيل الدخول أو إنشاء حساب</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="login">دخول</button><button id="signup">إنشاء حساب</button></section><section id="workspace" hidden><p id="who" class="muted"></p><button id="logout">تسجيل الخروج</button><section id="register" class="card" hidden><h2>استكمال طلب التسجيل</h2><input id="regName" placeholder=""><input id="regPlace" placeholder=""><button id="registerBtn">إرسال الطلب</button></section><section id="pending" class="card" hidden></section><section id="dashboard" class="card"><h2>طلبات المراكز</h2><table><thead><tr><th>المركز</th><th>الولاية</th><th>الحالة</th><th>القرار</th></tr></thead><tbody id="centers"></tbody></table><h2>إدارة المقاطعات والصلاحيات</h2><select id="centerSelect"></select><input id="district" placeholder="اسم المقاطعة"><button id="addDistrict">إضافة مقاطعة</button><p><select id="feature"></select><label><input id="enabled" type="checkbox"> منح الصلاحية</label><button id="grant">حفظ الصلاحية</button></p><h2>المستشارون</h2><table><thead><tr><th>الاسم</th><th>الحالة</th><th>المركز</th><th>الإسناد</th></tr></thead><tbody id="counselors"></tbody></table></section></section><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
