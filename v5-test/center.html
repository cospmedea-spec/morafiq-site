<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoraFiq 5.0</title><link rel="stylesheet" href="style.css"></head><body data-role="center"><header><h1>منصة مرافق — مركز التوجيه المدرسي والمهني</h1><p id="identity">التحقق من الحساب...</p></header><main><section id="auth" class="card"><h2>تسجيل الدخول أو إنشاء حساب</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="login">دخول</button><button id="signup">إنشاء حساب</button></section><section id="workspace" hidden><p id="who" class="muted"></p><button id="logout">تسجيل الخروج</button><section id="register" class="card" hidden><h2>استكمال طلب التسجيل</h2><input id="regName" placeholder="اسم مركز التوجيه"><input id="regPlace" placeholder="الولاية"><button id="registerBtn">إرسال الطلب</button></section><section id="pending" class="card" hidden></section><section id="dashboard" class="card" hidden><h2>الصلاحيات الممنوحة</h2><ul id="permissions"></ul><h2>الإحصائيات المجمعة من مستشاري المركز</h2><p class="muted">تعرض المجاميع فقط عند وجود ثلاثة مستشارين مساهمين على الأقل في نفس المجال والفترة.</p><table><thead><tr><th>المجال</th><th>الفترة</th><th>المجموع</th><th>عدد المساهمين</th></tr></thead><tbody id="stats"></tbody></table></section></section><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
