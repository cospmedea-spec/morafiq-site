<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoraFiq 5.0</title><link rel="stylesheet" href="style.css"></head><body data-role="counselor"><header><h1>منصة مرافق — مستشار التوجيه</h1><p id="identity">التحقق من الحساب...</p></header><main><section id="auth" class="card"><h2>تسجيل الدخول أو إنشاء حساب</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="login">دخول</button><button id="signup">إنشاء حساب</button></section><section id="workspace" hidden><p id="who" class="muted"></p><button id="logout">تسجيل الخروج</button><section id="register" class="card" hidden><h2>استكمال طلب التسجيل</h2><input id="regName" placeholder="الاسم واللقب"><input id="regPlace" placeholder="مؤسسة العمل"><button id="registerBtn">إرسال الطلب</button></section><section id="pending" class="card" hidden></section><section id="dashboard" class="card" hidden><h2>إرسال إحصائية إلى المركز</h2><p class="muted">أدخل أعدادًا إجمالية فقط، دون أسماء التلاميذ أو تفاصيل المقابلات.</p><select id="feature"></select><input id="period" placeholder="الفترة، مثل 2026-11"><input id="count" type="number" min="0" placeholder="العدد"><button id="send">حفظ وإرسال</button><h2>الإحصائيات المرسلة</h2><table><thead><tr><th>المجال</th><th>الفترة</th><th>العدد</th></tr></thead><tbody id="history"></tbody></table></section></section><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
